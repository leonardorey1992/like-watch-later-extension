<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add to Playlist Options</title>
  <style>
    body { font-family: Roboto, Arial, sans-serif; padding: 20px; width: 320px; }
    h1 { font-size: 16px; margin: 0 0 16px; }
    p.hint { font-size: 12px; color: #606060; margin: 0 0 16px; line-height: 1.5; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background-color: #065fd4; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0046a0; }
    #status { margin-top: 10px; font-size: 12px; }
    #status.ok { color: #188038; }
    #status.err { color: #c5221f; }
  </style>
</head>
<body>
  <h1>Target playlist</h1>
  <p class="hint">Enter your playlist's <b>name</b> (e.g. "My Watch Later") or paste its <b>URL</b> from the address bar, e.g. <code>https://www.youtube.com/playlist?list=PL...</code>.<br>The 3-dot menu on any video will get an "Add to &lt;playlist&gt;" item.</p>

  <label for="playlist">Playlist name or URL</label>
  <input type="text" id="playlist" placeholder="My Watch Later">
  <span id="idPreview" style="display:none; font-size:12px; color:#606060;"></span>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
