<!DOCTYPE html>
<html>
<head>
  <title>Like & Watch Later Options</title>
  <style>
    body { font-family: sans-serif; padding: 20px; width: 300px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; }
    button { padding: 8px 15px; background-color: #065fd4; color: white; border: none; border-radius: 2px; cursor: pointer; }
    button:hover { background-color: #0046a0; }
    #status { margin-top: 10px; color: green; font-size: 0.9em; }
  </style>
</head>
<body>
  <label for="playlist">Target Playlist Name:</label>
  <input type="text" id="playlist" placeholder="e.g. My Watch Later">
  
  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
